name: Build BelFVE

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'extras/BelFVE/**'
      - '.github/workflows/build_belfve.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'extras/BelFVE/**'
      - '.github/workflows/build_belfve.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@b3cda96fddef6af6c56b4c5efb5c47e2357935db  # v2.1.0

      - name: Initialize Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli core update-index

      - name: Provide placeholder configuration
        run: |
          cp extras/BelFVE/config_default.h extras/BelFVE/config.h
          cp extras/BelFVE/secret_default.h extras/BelFVE/secret.h

      - name: Compile BelFVE
        run: |
          arduino-cli compile ./extras/BelFVE
