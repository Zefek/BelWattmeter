profiles:
  BelFVE_ESP32:
    fqbn: esp32:esp32:esp32:PartitionScheme=default
    platforms:
      - platform: esp32:esp32 (3.2.0)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - PubSubClient (2.8.0)
      - dir: "../../src"
    port_config:
      baudrate: 115200
default_profile: BelFVE_ESP32
